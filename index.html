<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TaskFlow</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 min-h-screen flex items-center justify-center p-4">

  <div class="w-full mjax-w-md bg-slate-800 rounded-2xl shadow-2xl overflow-hidden border border-slate-700">

    <!-- Header -->
    <div class="bg-gradient-to-r from-indigo-600 to-purple-600 px-6 py-5">
      <h1 class="text-2xl font-bold text-white text-center tracking-wide">TaskFlow ✅</h1>
    </div>

    <!-- Input -->
    <div class="p-4 flex gap-2 border-b border-slate-700">
      <input
        id="taskInput"
        type="text"
        placeholder="What needs to be done?"
        class="flex-1 bg-slate-700 text-white placeholder-slate-400 rounded-lg px-4 py-2 outline-none focus:ring-2 focus:ring-indigo-500"
      >
      <button
        id="addBtn"
        class="bg-indigo-600 hover:bg-indigo-500 text-white font-semibold px-4 py-2 rounded-lg transition"
      >
        Add
      </button>
    </div>

    <!-- Task List -->
    <div id="taskList" class="min-h-[300px] max-h-[400px] overflow-y-auto p-4 space-y-2 [&::-webkit-scrollbar]:w-1.5 [&::-webkit-scrollbar-thumb]:bg-slate-600 [&::-webkit-scrollbar-thumb]:rounded-full">
      <!-- empty state / tasks injected here by JS -->
    </div>

    <!-- Footer -->
    <div class="flex items-center justify-between px-4 py-3 border-t border-slate-700 bg-slate-800/50">
      <span class="text-slate-300 text-sm">
        Total Tasks: <span id="totalCount" class="font-bold text-white">0</span>
      </span>
      <button
        id="deleteAllBtn"
        class="bg-red-600 hover:bg-red-500 text-white text-sm font-semibold px-3 py-1.5 rounded-lg transition"
      >
        Delete All
      </button>
    </div>

  </div>

<script src="script.js"></script>
</body>
</html>
